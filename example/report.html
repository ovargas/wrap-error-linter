<!DOCTYPE html>
<html>
<head>
    <title>Error Wrapping Linter Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .summary { background: #f0f0f0; padding: 10px; margin: 20px 0; border-radius: 5px; }
        .summary span { margin-right: 20px; }
        .error { color: #d32f2f; }
        .warning { color: #f57c00; }
        .info { color: #0288d1; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #333; color: white; padding: 10px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f5f5f5; }
        .file-path { font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Error Wrapping Linter Report</h1>
    <div class="summary">
        <strong>Summary:</strong>
        <span>Total: 1</span>
        <span class="error">Errors: 0</span>
        <span class="warning">Warnings: 1</span>
        <span class="info">Info: 0</span>
    </div>
    <table>
        <thead>
            <tr>
                <th>File</th>
                <th>Line</th>
                <th>Severity</th>
                <th>Rule</th>
                <th>Message</th>
            </tr>
        </thead>
        <tbody>
            
            <tr>
                <td class="file-path">/Users/orlandovargas/projects/ovargas/wrap-error-linter/example/main.go</td>
                <td>19:10</td>
                <td class="warn">warn</td>
                <td>unwrapped-external-error</td>
                <td>error from external package &#39;os&#39; should be wrapped</td>
            </tr>
            
        </tbody>
    </table>
</body>
</html>
